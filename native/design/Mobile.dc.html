<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #6d1422; text-decoration: none; }
    a:hover { color: #8a1b2c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; display: flex; flex-direction: column; justify-content: center; padding: 26px 18px;
     background:
       radial-gradient(520px 380px at 20% -10%, rgba(201, 162, 75, 0.16), transparent 60%),
       linear-gradient(160deg, #6d1422 0%, #4a0d17 60%, #2b0910 100%);">

  <div style="width: 100%; background: #ffffff; border-radius: 18px; overflow: hidden;
       box-shadow: 0 34px 70px -30px rgba(0, 0, 0, 0.55);">

    <div style="background: linear-gradient(120deg, #4a0d17, #6d1422); border-bottom: 3px solid #c9a24b;
         padding: 13px 14px; text-align: center; color: #f3e6c7;
         font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;">
      Online Examination Portal
    </div>

    <div style="padding: 24px 22px 0;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <svg width="58" height="58" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="68" height="68" rx="15" fill="#8a1b2c"></rect>
          <rect x="3" y="3" width="66" height="66" rx="14" stroke="#c9a24b" stroke-opacity="0.55" stroke-width="1.6"></rect>
          <rect x="17" y="41" width="20" height="6.5" rx="2" fill="#f3e6c7"></rect>
          <rect x="17" y="31" width="30" height="6.5" rx="2" fill="#f3e6c7"></rect>
          <rect x="17" y="21" width="38" height="6.5" rx="2" fill="#f3e6c7"></rect>
          <text x="36" y="62" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" letter-spacing="3" fill="#f3e6c7">ITM</text>
        </svg>
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 17px;
             line-height: 1.3; color: #4a0d17; text-align: center;">
          ITM Group of Institutions, Gwalior
        </div>
        <div style="width: 40px; height: 2px; background: #c9a24b;"></div>
      </div>

      <div style="text-align: center; font-size: 12px; color: #5f575a; margin: 10px 0 20px;">
        Sign in with your ITM GOI account
      </div>

      <div style="display: flex; flex-direction: column; gap: 13px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="mb-user" style="font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #21181a;">Username</label>
          <input id="mb-user" type="text" value="s2026001" style="width: 100%; padding: 13px; border: 1px solid #e7dfe0; border-radius: 10px; font-family: inherit; font-size: 15px; color: #21181a;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="mb-pass" style="font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #21181a;">Password</label>
          <input id="mb-pass" type="password" value="password" style="width: 100%; padding: 13px; border: 1px solid #e7dfe0; border-radius: 10px; font-family: inherit; font-size: 15px; color: #21181a;">
        </div>
      </div>

      <div style="text-align: right; margin: 8px 0 16px;">
        <a href="#" style="font-size: 12.5px; font-weight: 500;">Lost password?</a>
      </div>

      <button type="button" style="width: 100%; padding: 14px 16px; border: 0; border-radius: 10px;
           background: linear-gradient(135deg, #8a1b2c, #6d1422); color: #ffffff;
           font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; cursor: pointer;
           box-shadow: 0 12px 22px -12px rgba(138, 27, 44, 0.9);">
        Log in
      </button>

      <div style="margin: 20px -22px 0; padding: 12px 14px; background: #fbf3f4; border-top: 1px dashed #e7dfe0;
           text-align: center; font-size: 10.5px; letter-spacing: 0.4px; color: #7a6d6f;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a9822f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 5px;">
          <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
        Secure &#183; AI-proctored
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
