; ===================================================================
;  PHP runtime for Moodle assessment workloads  (native Windows / mod_php)
;  Generated by native\Setup-MoodleNative.ps1 - safe to regenerate.
; ===================================================================
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = "E:/ASSESMENT/native/stack/logs/php_error.log"
default_charset = "UTF-8"
default_socket_timeout = 300
file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50
upload_tmp_dir = "E:/ASSESMENT/native/stack/tmp"
sys_temp_dir  = "E:/ASSESMENT/native/stack/tmp"
date.timezone = "UTC"
realpath_cache_size = 4096k
realpath_cache_ttl = 600

extension_dir = "E:/ASSESMENT/native/stack/php/ext"
extension=curl
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=fileinfo
extension=mysqli
extension=pdo_mysql
extension=openssl
extension=soap
extension=sodium
extension=zip
extension=ldap
zend_extension=opcache

curl.cainfo = "E:/ASSESMENT/native/stack/php/extras/ssl/cacert.pem"
openssl.cafile = "E:/ASSESMENT/native/stack/php/extras/ssl/cacert.pem"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Moodle 4.5 + plugins here = ~18,100 .php files. The old 10000 / 128M left
; ~8k files uncacheable (recompiled every request) -> ~750-1000ms TTFB.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1

[session]
session.save_handler = files
session.save_path = "E:/ASSESMENT/native/stack/tmp"
session.gc_maxlifetime = 14400
