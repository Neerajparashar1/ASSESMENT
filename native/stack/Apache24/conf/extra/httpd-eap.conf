# ===================================================================
#  EAP vhost + hardening  (generated - mirrors config\apache\*.conf)
# ===================================================================
ServerName localhost:8080
LoadModule php_module "E:/ASSESMENT/native/stack/php/php8apache2_4.dll"
PHPIniDir "E:/ASSESMENT/native/stack/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
DirectoryIndex index.php index.html
AcceptPathInfo On

ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot "E:/ASSESMENT/native/stack/moodle"
<Directory "E:/ASSESMENT/native/stack/moodle">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "E:/ASSESMENT/native/stack/moodle/(\.git|\.github|node_modules|tests)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "0"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=()"
    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains" "expr=%{HTTPS} == 'on'"
    Header always unset X-Powered-By
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json application/xml image/svg+xml
</IfModule>
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType text/css "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    ExpiresByType font/woff2 "access plus 30 days"
</IfModule>

ErrorLog "E:/ASSESMENT/native/stack/logs/moodle_error.log"
CustomLog "E:/ASSESMENT/native/stack/logs/moodle_access.log" common
