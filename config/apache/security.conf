# =====================================================================
#  PHASE 6 - Apache hardening (loaded from conf-enabled)
# =====================================================================
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "0"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=()"
    # HSTS is emitted only when the request arrived over HTTPS
    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains" "expr=%{HTTPS} == 'on'"
    Header unset X-Powered-By
    Header always unset X-Powered-By
</IfModule>

# Block dotfiles (.htaccess/.env/.git) from being served
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
