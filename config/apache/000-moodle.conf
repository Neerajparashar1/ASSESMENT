# =====================================================================
#  PHASE 6 - Apache virtual host for Moodle
#  AllowOverride All (URL rewriting), sane security, gzip, cache headers
# =====================================================================
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/moodle

    <Directory /var/www/html/moodle>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the private data directory or VCS metadata
    <DirectoryMatch "/var/www/html/moodle/(\.git|\.github|tests|node_modules)">
        Require all denied
    </DirectoryMatch>

    # Moodle clean-URL / slash-argument support
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>

    # ---- Compression -----------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css \
            application/javascript application/json application/xml image/svg+xml
    </IfModule>

    # ---- Static asset caching (Moodle revs assets in the URL) ----
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/*        "access plus 30 days"
        ExpiresByType text/css       "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType font/*         "access plus 30 days"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>
